name: Deploy Split-Beat HE guide

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/deploy-docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: split-beat-he-docs-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check links and images
        run: node tools/check_site.mjs site
      - name: Deploy to Cloudflare Pages
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          : "${CLOUDFLARE_ACCOUNT_ID:?Configure the GitHub repository variable}"
          : "${CLOUDFLARE_API_TOKEN:?Configure the GitHub repository secret}"
          projects="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          result=$(mktemp)
          status=$(curl --silent --show-error -o "$result" -w '%{http_code}' "${auth[@]}" "$projects/split-docs")
          case "$status" in
            200) jq -e '.success and (.result.production_branch == "main")' "$result" >/dev/null ;;
            404) curl --fail-with-body --silent --show-error "${auth[@]}" \
              --data '{"name":"split-docs","production_branch":"main"}' "$projects" | jq -e '.success' >/dev/null ;;
            *) jq -c '.errors' "$result" >&2; exit 1 ;;
          esac
          npx --yes wrangler@4.158.0 pages deploy site --project-name split-docs --branch main
          domains="$projects/split-docs/domains"
          current=$(curl --fail-with-body --silent --show-error "${auth[@]}" "$domains")
          if ! jq -e '.result | any(.name == "docs.codekilab.com")' <<< "$current" >/dev/null; then
            curl --fail-with-body --silent --show-error "${auth[@]}" \
              --data '{"name":"docs.codekilab.com"}' "$domains" | jq -e '.success' >/dev/null
          fi
